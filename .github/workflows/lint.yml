name: Lint

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Node / Bun のバージョンはルートの package.json (devEngines / packageManager) で指定
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck updater-core
        working-directory: packages/updater-core
        run: bun run typecheck

      # cli / updater-cli は updater-core の dist の型を参照するので先にビルドしておく
      - name: Build updater-core
        working-directory: packages/updater-core
        run: bun run build

      - name: Typecheck cli
        working-directory: packages/cli
        run: bun run typecheck

      - name: Typecheck updater-cli
        working-directory: packages/updater-cli
        run: bun run typecheck
