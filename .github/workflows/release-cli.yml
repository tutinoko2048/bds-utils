name: Release CLI

on:
  workflow_dispatch:
  push:
    tags:
      - "utils@*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Node / Bun のバージョンはルートの package.json (devEngines / packageManager) で指定
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          registry-url: "https://registry.npmjs.org"
          # publish するワークフローなのでキャッシュは使わない
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read package version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # タグからバージョンを抽出 (utils@1.2.3 -> 1.2.3)
          if [ "$REF_TYPE" = "tag" ]; then
            current_version="${REF_NAME#utils@}"
          else
            # 手動実行の場合はpackage.jsonから取得
            current_version=$(node -p -e "require('./packages/cli/package.json').version")
          fi
          echo "version=$current_version" >> "$GITHUB_OUTPUT"

          # プレリリース版判定
          if [[ $current_version =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            # プレリリース識別子を抽出 (1.2.3-beta.2 -> beta)
            prerelease_tag=$(echo "$current_version" | sed 's/^[0-9]\+\.[0-9]\+\.[0-9]\+-\([a-z]\+\).*/\1/')
            echo "prerelease_tag=$prerelease_tag" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build updater-core
        working-directory: packages/updater-core
        run: bun run build

      - name: Publish bds-utils
        # bun publish がOIDC非対応のため、npm publish を使う
        # prepackだと実行前にpackage.jsonが読み込まれて0.0.0のままになるため、事前に手動でbuildしておく
        working-directory: packages/cli
        env:
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
          PRERELEASE_TAG: ${{ steps.version.outputs.prerelease_tag }}
        run: |
          bun run typecheck
          bun run build
          bun pm pack
          if [ "$IS_PRERELEASE" = "true" ]; then
            npm publish *.tgz --provenance --access public --tag "$PRERELEASE_TAG"
          else
            npm publish *.tgz --provenance --access public
          fi

      - name: Build Linux executable
        working-directory: packages/cli
        run: bun run compile:linux

      - name: Build Windows executable
        working-directory: packages/cli
        run: bun run compile:windows

      - name: Zip executables
        working-directory: packages/cli/build
        run: |
          zip -9 bds-utils-linux.zip bds-utils-linux
          zip -9 bds-utils-windows.zip bds-utils-windows.exe

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            --title "bds-utils v$VERSION" \
            --generate-notes \
            packages/cli/build/bds-utils-linux \
            packages/cli/build/bds-utils-windows.exe \
            packages/cli/build/bds-utils-linux.zip \
            packages/cli/build/bds-utils-windows.zip
